# FREE test setup: no persistent disk, so the database is wiped on every restart, redeploy and
# wake-from-sleep. Use sample data only. For real records use render.paid.yaml (rename to render.yaml).
services:
  - type: web
    name: ftz-system
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FTZ_AUTH_USER
        value: admin
      - key: FTZ_AUTH_PASSWORD
        sync: false        # you type this in the Render dashboard; never commit it
      - key: FTZ_DEMO_MODE
        value: "true"      # front page shows a demo login and sample data. Remove for real records.
      - key: FTZ_TRUST_PROXY
        value: "1"         # Render terminates HTTPS in front of the app
