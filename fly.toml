# fly.toml app configuration file generated for catair-ftz on 2026-10-28T21:22:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'catair-ftz'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  FTZ_COOKIE_SECURE = '1'
  FTZ_HOST = '0.0.0.0'
  FTZ_SKIP_DDL = '1'
  FTZ_TRUST_PROXY = '1'
  PORT = '8214'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
